stages:
  - build
  - test
  - security
  - approve
  - deploy-canary
  - deploy-full

variables:
  NODE_VERSION: "18"

build:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/

test_unit_regression:
  stage: test
  image: node:${NODE_VERSION}
  script:
    - npm test           # corre wallet.test.js: incluye la prueba de round2 (redondeo)
  allow_failure: false    # crítico: si falla, el pipeline se detiene aquí

security_scan:
  stage: security
  image: node:${NODE_VERSION}
  script:
    - npm audit --audit-level=high
  allow_failure: true

manual_approval:
  stage: approve
  script:
    - echo "Esperando aprobacion manual antes de produccion"
  when: manual

deploy_canary:
  stage: deploy-canary
  script:
    - echo "Desplegando a 5% de usuarios (canary)"
  environment:
    name: production-canary
  when: manual

deploy_full:
  stage: deploy-full
  script:
    - echo "Desplegando al 100% de usuarios"
  environment:
    name: production
  when: manual